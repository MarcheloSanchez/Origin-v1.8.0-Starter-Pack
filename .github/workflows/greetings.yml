name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: >
          👋 Welcome, and thanks for opening your first issue!

          Origin is an evolving Obsidian-based system focused on clarity, structure,
          and long-term usability. Feel free to report bugs, ask questions,
          suggest improvements, or challenge assumptions.

          If your idea leads to a concrete improvement, PRs are welcome.
          Please keep proposals practical and aligned with the core philosophy:
          minimal friction, strong structure, and real-world use.

        pr-message: >
          🚀 Thanks for your first pull request — and welcome to Origin!

          I really appreciate you taking the time to contribute.
          Please add a short explanation of *why* the change exists
          (not just *what* it changes), as this project values intent and maintainability.

          By contributing, you agree that improvements remain open and attributed
          under the project license. I’ll review and respond as soon as possible.
